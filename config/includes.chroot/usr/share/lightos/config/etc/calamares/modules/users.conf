---
defaultGroups:
    - users
    - sudo
    - audio
    - video
    - cdrom
    - plugdev
    - netdev
    - input
    - bluetooth
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
sudoersConfigureWithGroup: false

# root ЗАБЛОКИРОВАН, а не получает пароль пользователя.
# Раньше здесь стояло setRootPassword: true + doReusePassword: true,
# то есть пароль root был ИДЕНТИЧЕН паролю нового пользователя. При
# пустых требованиях к паролю (см. ниже) это давало вход root по
# паролю «1»: пароль пользователя — пароль root, без всякой разницы.
# Теперь единственный вход с правами администратора — sudo, а учётка
# root не имеет пароля и не может быть использована для входа.
setRootPassword: false
doReusePassword: false

passwordRequirements:
    nonempty: true
    # Раньше стояло minLength: -1 (не проверять длину) вместе с
    # libpwquality minlen=0/minclass=0 — установщик принимал ЛЮБОЙ
    # пароль, включая пустой и односимвольный.
    minLength: 8
    maxLength: -1
    libpwquality:
        - minlen=8
        # 2 = нужны две разные категории символов: строчные буквы
        # и что-то ещё (цифры, заглавные, спецсимволы). Не 3, потому
        # что требование «буква + цифра + спецсимвол» на этом ноутбуке
        # превращается в 3 попытки ввести пароль и отказаться от
        # установки.
        - minclass=2
        - maxrepeat=3
    retry: 3

# allowWeakPasswords: true означало «пропускать проверку словарных
# паролей» — единственное, что угодно было валидно. Теперь пароль
# проверяется на длину и классы символов.
allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
    shell: /bin/bash
    forbidden_names: [ root, admin, administrator, superuser, nobody ]

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "${product}-${first}"

presets:
    fullName:
        editable: true
    loginName:
        editable: true