---
showSupportUrl: true
showKnownIssuesUrl: false
showReleaseNotesUrl: false

requirements:
    requiredStorage: 4.0
    requiredRam: 1.0
    internetCheckUrl: http://deb.debian.org
    check:
        - storage
        - ram
        - power
        - root
        - screen
    required:
        - ram

geoip:
    style: "none"
    url: "https://geoip.kde.org/v1/ubiquity"
    selector: "CountryCode"