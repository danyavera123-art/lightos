name: Сборка LightOS

# Сборка ISO и публикация в GitHub Releases.
# Нужный запуск вручную: вкладка Actions -> Сборка LightOS -> Run workflow.
# Ничего не запускается само по push — сборка тяжёлая.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза, например 1.0.0 (или 1.0.0-rc1). Без буквы v.'
        required: true
        default: '1.0.0'
      publish:
        description: 'Опубликовать ISO в Releases после сборки?'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: lightos-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Собираем внутри debian:bookworm, а не на ubuntu-latest.
    #
    # На ubuntu-latest (noble) ставится live-build 3.0~a57-1. Он при
    # установке ядра качает
    #     dists/<дистрибутив>/Contents-<архитектура>.gz
    # но Debian давно перенёс Contents внутрь компонентов:
    #     dists/bookworm/Contents-amd64.gz          -> 404
    #     dists/bookworm/main/Contents-amd64.gz    -> 200
    # и сборка падает с «ERROR 404» на этапе lb_chroot_linux-image.
    #
    # В bookworm живёт live-build 20230502, который Contents не качает
    # вовсе, плюс это тот же дистрибутив, который мы собираем.
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
      # --privileged обязателен: live-build внутри chroot монтирует
      # /dev/pts и /proc. Без CAP_SYS_ADMIN это даёт
      #   mount: .../chroot/dev/pts: permission denied
      # и сборка падает на этапе bootstrap.
      options: --privileged
    # 4 ГБ RAM: debootstrap + установка 700+ пакетов + squashfs с xz.
    # На 2 ГБ live-build умирает на этапе сжатия.
    timeout-minutes: 150

    # В контейнерных работах GitHub запускает run-шаги под `sh`, а это dash.
    # Всё, что bash-специфично, там падает: шаг «Проверяем синтаксис» с
    #   done < <(find ...)
    # умирал с «Syntax error: redirection unexpected» ещё до проверки.
    # Явно просим bash для всех шагов этой работы.
    defaults:
      run:
        shell: bash

    steps:
      # checkout требует git, а в образе debian:bookworm его нет.
      # Поэтому ставим зависимости ДО checkout.
      - name: Ставим зависимости
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git \
            ca-certificates \
            live-build \
            debootstrap \
            debian-archive-keyring \
            isolinux \
            syslinux-common \
            squashfs-tools \
            xorriso \
            mtools \
            dosfstools \
            parted \
            fdisk \
            grub-pc-bin \
            grub-efi-amd64-bin \
            curl \
            file
          echo "--- версии ---"
          lb --version
          debootstrap --version

      - name: Берём исходники
        uses: actions/checkout@v4

      # Проверка синтаксика ДО сборки. Сборка занимает ~15 минут и
      # стоит около гигабайта трафика; ловить опечатку в bash через
      # 15 минут после старта невыгодно. Этот шаг занимает секунды.
      - name: Проверяем синтаксис скриптов
        run: |
          set -e
          FAILED=0

          echo "::group::bash -n"
          while IFS= read -r f; do
            if bash -n "$f" 2>/tmp/synerr; then
              echo "  OK    $f"
            else
              echo "  FAIL  $f"
              sed 's/^/        /' /tmp/synerr
              FAILED=1
            fi
          done < <(find config/hooks config/includes.chroot/usr/bin \
                       build.sh make-update-payload.sh -type f 2>/dev/null | sort)
          echo "::endgroup::"

          # shellcheck ловит то, чего bash -n не видит: нецитированные
          # переменные, потерянные коды возврата, опечатки в именах.
          if command -v shellcheck >/dev/null 2>&1; then
            echo "::group::shellcheck (критичное)"
            # SC2086 и SC2181 -- самые частые и самые опасные здесь.
            # Остальные предупреждения не валят сборку.
            shellcheck -S error -e SC2086,SC2181 \
              build.sh make-update-payload.sh \
              config/includes.chroot/usr/bin/*.sh \
              config/hooks/live/*.chroot config/hooks/live/*.chroot_early \
              || FAILED=1
            echo "::endgroup::"
          else
            echo "::warning::shellcheck не установлен -- пропускаем"
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Есть ошибки в скриптах. Сборка не запускается."
            exit 1
          fi
      - name: Собираем ISO
        run: |
          set -e
          VERSION='${{ github.event.inputs.version }}'
          TAG="v${VERSION}"
          echo "::group::Сборка LightOS ${TAG}"

          # В контейнере мы уже root. На обычном раннере был бы нужен sudo,
          # поэтому оставляем запасной вариант.
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi

          OUT="$PWD/_artifacts"
          mkdir -p "$OUT"

          # SKIP_RELEASE=1: публикацией занимается отдельная работа ниже,
          # где есть gh и токен. RELEASE_TAG прокидываем явно, потому что
          # sudo не наследует переменные окружения.
          $SUDO env SKIP_RELEASE=1 RELEASE_TAG="${TAG}" \
            bash ./build.sh --output-dir "${OUT}" || {
            echo "::error::Сборка упала. Лог выше — ищите строку с ошибкой live-build."
            exit 1
          }

          ISO=$(find "$OUT" -maxdepth 1 -name '*.iso' | head -1)
          [ -n "$ISO" ] || { echo "::error::ISO не найден в $OUT"; ls -la "$OUT"; exit 1; }

          SIZE_MB=$(du -m "$ISO" | cut -f1)
          echo "ISO собран: $ISO (${SIZE_MB} МБ)"

          # Лимит GitHub Releases — 2 ГБ. Если переросли, это надо знать.
          if [ "$SIZE_MB" -gt 2000 ]; then
            echo "::error::ISO ${SIZE_MB} МБ больше лимита GitHub Releases (2000 МБ). Публикация невозможна без уменьшения."
            exit 1
          fi

          mv "$ISO" "$OUT/lightos-${VERSION}.iso"
          ( cd "$OUT" && sha256sum "lightos-${VERSION}.iso" > "lightos-${VERSION}.iso.sha256" )
          ls -la "$OUT"

      - name: Готовим пакет обновления (для кнопки «Обновить LightOS»)
        run: |
          set -e
          VERSION='${{ github.event.inputs.version }}'
          bash ./make-update-payload.sh "$VERSION"
          ls -la dist-update/

      - name: Прикрепляем ISO
        uses: actions/upload-artifact@v4
        with:
          name: lightos-iso-${{ github.event.inputs.version }}
          path: |
            _artifacts/lightos-${{ github.event.inputs.version }}.iso
            _artifacts/lightos-${{ github.event.inputs.version }}.iso.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Прикрепляем пакет обновления
        uses: actions/upload-artifact@v4
        with:
          name: lightos-update-${{ github.event.inputs.version }}
          path: |
            dist-update/lightos-update-${{ github.event.inputs.version }}.tar.gz
            dist-update/SHA256SUMS
          retention-days: 90
          if-no-files-found: error

      - name: Итог сборки
        run: |
          {
            echo "### Сборка ${{ github.event.inputs.version }} завершена"
            echo ""
            echo "| Файл | Размер |"
            echo "|---|---|"
            ls -la _artifacts/ dist-update/ 2>/dev/null | grep -E '\.iso|\.tar\.gz' \
              | awk '{printf "| %s | %s |\n", $9, $5}'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    # Отдельная работа на обычном раннере: здесь есть gh CLI и токен.
    # В контейнере debian:bookworm gh нет, а ставить его ради одного шага
    # смысла не было.
    needs: build
    if: github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - name: Скачиваем артефакты
        uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Публикуем в Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ github.event.inputs.version }}
        run: |
          set -e
          VERSION='${{ github.event.inputs.version }}'
          REPO="$GITHUB_REPOSITORY"

          echo "::group::Файлы к публикации"
          ls -la files/
          MISSING=""
          for f in "files/lightos-${VERSION}.iso" "files/lightos-${VERSION}.iso.sha256" "files/lightos-update-${VERSION}.tar.gz" "files/SHA256SUMS"; do
            [ -f "$f" ] || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Не хватает файлов:$MISSING"
            exit 1
          fi

          cat > release-notes.md <<EOT
          ## LightOS ${TAG}

          | | |
          |---|---|
          | Дистрибутив | Debian 12 (bookworm) |
          | Рабочий стол | XFCE, композитор выключен |
          | Установщик | Calamares |

          ### Что нового
          * Драйверы видеокарты ставятся автоматически: дискретный Radeon
            больше не остаётся без драйвера. Это была главная причина лагов.
          * Wi-Fi Broadcom BCM4313/4321: вместо бесполезного firmware-brcm80211
            ставится проприетарный broadcom-sta через DKMS.
          * Кнопка «Обновить LightOS» — обновляет систему через интернет,
            без флешки и без другого компьютера.
          * Кнопка «Оптимизация» — отключает композитор и анимации.
          * Откат обновления: sudo lightos-update --rollback

          ### Файлы
          | Файл | Для чего |
          |---|---|
          | lightos-${VERSION}.iso | запись на флешку и установка |
          | lightos-${VERSION}.iso.sha256 | проверка целостности ISO |
          | lightos-update-${VERSION}.tar.gz | кнопка «Обновить LightOS» |
          | SHA256SUMS | контрольные суммы пакета обновления |

          ### Как ставить
          1. Запишите ISO на флешку: Rufus в режиме DD, balenaEtcher или Ventoy.
          2. Загрузитесь с флешки и запустите «Установить LightOS».
          3. После установки: Центр приложений -> «Драйверы».
          EOT

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Релиз $TAG уже существует — перезаписываем файлы"
            gh release upload "$TAG" \
              "files/lightos-${VERSION}.iso" \
              "files/lightos-${VERSION}.iso.sha256" \
              "files/lightos-update-${VERSION}.tar.gz" \
              "files/SHA256SUMS" \
              --repo "$REPO" --clobber
            gh release edit "$TAG" --notes-file release-notes.md --repo "$REPO"
          else
            gh release create "$TAG" \
              "files/lightos-${VERSION}.iso" \
              "files/lightos-${VERSION}.iso.sha256" \
              "files/lightos-update-${VERSION}.tar.gz" \
              "files/SHA256SUMS" \
              --repo "$REPO" \
              --title "LightOS $TAG" \
              --notes-file release-notes.md
          fi

          URL="https://github.com/${REPO}/releases/tag/${TAG}"
          echo "::notice::Опубликовано: $URL"
          echo "Опубликовано: $URL" >> "$GITHUB_STEP_SUMMARY"

          # Releases по умолчанию показывают «последний» релиз. Без этого
          # --latest кнопка «Обновить LightOS» не найдёт новую версию,
          # потому что GitHub считает latest по дате публикации.
          gh release edit "$TAG" --repo "$REPO" --latest >/dev/null 2>&1 \
            && echo "Релиз помечен как последний" \
            || echo "::warning::не удалось пометить релиз как последний"
