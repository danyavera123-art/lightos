name: Диагностика live-build

# Временный воркфлоу: сравниваем live-build из bookworm и из noble
# и смотрим, кто вообще качает Contents-amd64.gz.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bookworm:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    timeout-minutes: 15
    steps:
      - name: Ставим зависимости
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates live-build debootstrap
      - name: Версия и наличие Contents-запроса
        run: |
          echo "### bookworm: live-build"
          lb --version
          apt-cache policy live-build | head -3
          echo
          echo "### кто качает Contents-"
          grep -rn 'Contents-' /usr/lib/live/build/ /usr/bin/lb 2>/dev/null | head -10 || echo "(не найдено)"
          echo
          echo "### есть ли lb_chroot_linux-image"
          ls /usr/lib/live/build/ | head -40

  noble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Ставим зависимости
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ca-certificates live-build
      - name: Версия и код
        run: |
          echo "### noble: live-build"
          lb --version
          echo
          echo "### кто качает Contents-"
          grep -rn 'Contents-' /usr/lib/live/build/ /usr/bin/lb 2>/dev/null | head -10 || echo "(не найдено)"